[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galinear-prediction-network"
version = "0.1.0"
description = "Matched tests of online low-rank weight trajectory prediction"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
benchmark = ["torchvision>=0.17"]

[tool.setuptools]
packages = ["galinear", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
